# Local development stack for Dofixo.
#
#   docker compose up -d --build   start (rebuild images if Dockerfiles changed)
#   docker compose ps              check health
#   docker compose logs -f backend
#   docker compose down            stop, keep data
#   docker compose down -v         stop and wipe the database volume
#
# ⚠️ AFTER ADDING OR CHANGING A DEPENDENCY, `--build` IS NOT ENOUGH:
#
#   docker compose up -d --build -V frontend    (or backend)
#
# `-V` is --renew-anon-volumes. Both app services mount an anonymous volume
# over /app/node_modules (see the comment on the backend one below), and
# Compose deliberately carries anonymous volumes across a container
# recreation — so `--build` produces a new image with the new dependency and
# then hides its node_modules behind the old volume. The container goes on
# running the modules it installed the first time it ever started.
#
# This has already cost an afternoon once: framer-motion was added on
# 2026-09-08 and the frontend container kept answering
#
#   [plugin:vite:import-analysis] Failed to resolve import "framer-motion"
#
# on 5173, while `pnpm dev` on the host worked on 5174 — because the host's
# node_modules had it and the container's volume did not. `-V` is the fix;
# `docker compose exec frontend pnpm install` is the fix without a rebuild.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dofixo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dofixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dofixo}
      POSTGRES_DB: ${POSTGRES_DB:-dofixo_dev}
      # Persian text is stored in this database. UTF8 is already the image
      # default; stating it keeps the assumption visible. Collation is left at
      # the image default so local dev matches a stock managed instance.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dofixo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dofixo} -d ${POSTGRES_DB:-dofixo_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dofixo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Waits for pg_isready above, not just "container started" — Postgres
        # can take a moment past process-start before it accepts connections.
        condition: service_healthy
    environment:
      # Overrides backend/.env's DATABASE_URL (which points at localhost for
      # running the API directly on the host, outside Docker). Inside this
      # compose network "postgres" is the service's DNS name, not localhost.
      # dotenv's config() never overwrites a variable process.env already
      # has, so this wins over whatever is in the bind-mounted .env file
      # without needing to edit or delete that file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-dofixo}:${POSTGRES_PASSWORD:-dofixo}@postgres:5432/${POSTGRES_DB:-dofixo_dev}?schema=public
      PORT: ${BACKEND_PORT:-5001}
      DATABASE_URL_APP: postgresql://dofixo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dofixo_dev}?schema=public
      # No reverse proxy in local dev — see the comment on this var in
      # backend/.env.example.
      TRUST_PROXY: "0"
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ./backend:/app
      # Anonymous volume: shadows the bind mount at this one path so the
      # container keeps the node_modules it installed for itself (linux)
      # instead of whatever host OS/arch you ran `pnpm install` under. Without
      # this, native deps like sharp fail to load inside the container.
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dofixo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # ASSUMPTION: frontend/src/api/index.js reads this. Confirm/adjust once
      # that file is checked — see the note above this compose file.
      VITE_API_URL: http://localhost:${BACKEND_PORT:-5001}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  dofixo_pgdata:
