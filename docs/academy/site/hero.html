<!doctype html>
<!--
  تصویر hero صفحه‌ی اول سایت: فهرست دستگاه‌ها در قاب مرورگر و داشبورد در قاب
  گوشی. shots/tutorials/site.mjs اول دو عکس را می‌گیرد و بعد این صفحه را با
  پس‌زمینه‌ی شفاف عکس می‌گیرد ← out/shots/site/hero.webp.
  {{SHOTS}} و {{FONTS}} را اسکریپت پر می‌کند.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Yekan; src: url("{{FONTS}}/IranYekanX/IRANYekanXFaNum-Regular.woff2"); font-weight: 400; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  #stage { position: relative; width: 1520px; height: 1120px; }

  .browser {
    position: absolute; left: 230px; top: 60px; width: 1210px;
    border-radius: 18px; overflow: hidden; background: #fff;
    /* سایه‌ها باید پیش از لبه‌ی #stage به صفر برسند، وگرنه لبه‌ی تصویر روی سایت دیده می‌شود */
    box-shadow: 0 0 0 1px rgba(17, 14, 45, 0.06), 0 30px 60px -24px rgba(17, 14, 45, 0.26);
  }
  .bar { height: 44px; background: #f1f3f7; display: flex; align-items: center; padding: 0 18px; gap: 16px; direction: ltr; border-bottom: 1px solid #e3e6ec; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .url { flex: 1; max-width: 420px; margin: 0 auto; height: 26px; border-radius: 8px; background: #fff; border: 1px solid #e3e6ec;
         display: flex; align-items: center; justify-content: center; gap: 6px; font: 400 13px Yekan, sans-serif; color: #6b6884; }
  .browser img { display: block; width: 100%; }

  .phone {
    position: absolute; left: 90px; top: 430px; width: 274px; padding: 12px;
    background: #16142b; border-radius: 42px;
    box-shadow: inset 0 0 0 2px #2d2a4a, 0 30px 50px -20px rgba(17, 14, 45, 0.42);
  }
  .phone .screen { border-radius: 31px; overflow: hidden; position: relative; background: #fff; }
  .phone .screen::before { content: ""; position: absolute; top: 8px; left: 50%; width: 74px; height: 20px; margin-left: -37px; border-radius: 12px; background: #16142b; }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="browser">
    <div class="bar">
      <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="url">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6884" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        app.dofixo.ir
      </div>
      <div style="width:52px"></div>
    </div>
    <img src="{{SHOTS}}/devices.webp" alt="">
  </div>
  <div class="phone"><div class="screen"><img src="{{SHOTS}}/dashboard-mobile.webp" alt=""></div></div>
</div>
</body>
</html>
