<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Dofixo light and dark mockup</title>
<link rel="stylesheet" href="common.css">
<style>
  body {
    background:
      radial-gradient(1100px 700px at 50% 120%, rgba(37,99,235,.20), transparent 60%),
      radial-gradient(600px 420px at 8% 10%, rgba(14,165,233,.12), transparent 60%),
      linear-gradient(180deg, #f8fafc 0%, #eef2f8 100%);
    color: #0f172a;
  }
  .dots-bg { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(15,23,42,.09) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 55%); }
  header { position: absolute; top: 74px; left: 0; right: 0; text-align: center; }
  .tag { display: inline-flex; align-items: center; gap: 12px; padding: 8px 18px 8px 10px; border-radius: 999px;
    background: #fff; box-shadow: 0 0 0 1px #e2e8f0, 0 6px 16px -8px rgba(15,23,42,.2); font-size: 17px; font-weight: 500; color: #334155; }
  .tag img { width: 30px; height: 30px; padding: 6px; border-radius: 9px; background: #2563eb; }
  h2 { margin-top: 24px; font-size: 56px; font-weight: 700; letter-spacing: -1px; line-height: 1.3; }
  h2 span { color: #2563eb; }
  header p { margin-top: 12px; font-size: 22px; color: #64748b; }
  .toggle { position: absolute; z-index: 5; left: 50%; top: 322px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: #0f172a;
    box-shadow: 0 18px 36px -12px rgba(15,23,42,.5); }
  .toggle span { display: flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 999px; color: #cbd5e1; font-size: 17px; font-weight: 500; }
  .toggle span.on { background: #fff; color: #0f172a; }
  .toggle svg { width: 18px; height: 18px; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; z-index: 6;
    background: linear-gradient(180deg, transparent, rgba(238,242,248,.95)); }
</style>
</head>
<body>
  <div class="dots-bg"></div>
  <header>
    <div class="tag"><img src="logo-white.png">دوفیکسو · app.dofixo.ir</div>
    <h2>روز و شب، <span>یک کارگاه مرتب</span></h2>
    <p>تم روشن و تیره با یک کلیک — طراحی‌شده برای ساعت‌ها کار پشت میز تعمیر</p>
  </header>

  <div class="toggle">
    <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>روشن</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>تیره</span>
  </div>

  <div class="browser dark" style="right: 110px; top: 390px; width: 1060px; transform: rotate(1.2deg);">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url"><b>🔒</b>app.dofixo.ir/customers/1</div><div style="width:52px"></div></div>
    <img src="22-customer-detail-dark.png">
  </div>

  <div class="browser" style="left: 110px; top: 450px; width: 1060px; transform: rotate(-1deg);">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url"><b>🔒</b>app.dofixo.ir/devices</div><div style="width:52px"></div></div>
    <img src="02-devices.png">
  </div>

  <div class="fade"></div>
</body>
</html>
