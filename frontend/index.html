<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="دوفیکسو — نرم‌افزار مدیریت تعمیرگاه: ثبت دستگاه، مدیریت مشتریان، فاکتور تعمیر، انبار قطعات و گزارش‌ها"
    />
    <meta
      name="keywords"
      content="دوفیکسو, تعمیرات, مدیریت تعمیرگاه, فاکتور تعمیر, انبار قطعات, مدیریت مشتریان, نرم افزار تعمیرات"
    />
    <meta
      name="theme-color"
      content="#f3f6fb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#25272e"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="دوفیکسو — مدیریت تعمیرگاه" />
    <meta
      property="og:description"
      content="دوفیکسو، نرم‌افزار مدیریت تعمیرگاه‌های کوچک"
    />
    <meta property="og:type" content="website" />
    <title>دوفیکسو — مدیریت تعمیرگاه</title>

    <!--
      Runs before the first paint, which React cannot: ThemeProvider only
      applies the theme in an effect, so a user on dark would see one white
      frame on every load. Kept inline and dependency-free for the same
      reason — an external file would be a round trip before that paint.

      The key and the accepted values must match src/context/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dofixo-theme");
          var preference =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var resolved =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (err) {
          // Private mode can throw on localStorage. Light is the default the
          // stylesheet already assumes, so there is nothing to repair.
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
