server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames, so a changed file gets a new name
    # and the old one can be cached for as long as the browser likes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # public/ assets keep their names across builds, so they get a window
    # short enough that a replaced logo appears within a month.
    location ~* ^/(fonts|icons)/ {
        expires 30d;
        access_log off;
    }

    # index.html is what points at the current asset filenames. A cached copy
    # pins the browser to bundles that no longer exist — a blank page after a
    # deploy, with nothing in the logs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: an unmatched path is a React Router route, not a
    # missing file. Without this, reloading on /devices returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}